name: Publish Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read


jobs:


# =============================================================================
# Build
# =============================================================================

  build:

    name: Build

    runs-on: ubuntu-latest

    steps:

      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      -
        name: Check tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      -
        name: NPM Install
        run: npm clean-install

      -
        name: NPM Run Lint
        run: npm run lint

      -
        name: NPM Run Test
        run: npm test

      -
        name: NPM Run Build
        run: npm run build

      -
        name: NPM Run Test Package
        run: npm run test:package

      -
        name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/


# =============================================================================
# Create a GitHub Release
# =============================================================================

  release:

    name: Create GitHub Release

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      -
        name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      -
        name: Create Release
        run: |
          (cd dist && zip -9qr "../boot.gl-$GITHUB_REF_NAME.zip" .)
          gh release create "$GITHUB_REF_NAME" "boot.gl-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# =============================================================================
# Publish to NPM
# =============================================================================

  publish-npm:

    name: Publish NPM

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # npm provenance and trusted publishing

    steps:

      -
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      # Trusted publishing (OIDC) needs npm >= 11.5.1; without a trusted
      # publisher configured on npmjs.com, npm falls back to the token
      -
        name: Update npm
        run: npm install --global npm@^11.5.1

      -
        name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      -
        name: Publish NPM
        working-directory: dist
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PUBLISH_NPM_TOKEN }}
