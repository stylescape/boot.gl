# =============================================================================
# boot.gl - Production Build Configuration
# =============================================================================

---

options:
    mode: production
    logLevel: info

# =============================================================================
# Stages
# =============================================================================

stages:

    - name: Build
      description: "Production build for boot.gl (CSS reset library)"

      steps:

            # Clean dist directory
            # -----------------------------------------------------------------
            - name: CleanDistDirectory
              action: DirectoryCleanAction
              options:
                  dirPath: "./dist"

            # Process reset SCSS to CSS (compressed)
            # -----------------------------------------------------------------
            - name: ProcessMainStylesMinified
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/index.scss"
                  outputFile: "./dist/css/boot.gl.min.css"
                  styleOption: "compressed"

            # Process reset SCSS to CSS (expanded)
            # -----------------------------------------------------------------
            - name: ProcessMainStylesExpanded
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/index.scss"
                  outputFile: "./dist/css/boot.gl.css"
                  styleOption: "expanded"

            # Process normalize SCSS to CSS (compressed)
            # -----------------------------------------------------------------
            - name: ProcessNormalizeStylesMinified
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/normalize.scss"
                  outputFile: "./dist/css/normalize.min.css"
                  styleOption: "compressed"

            # Process normalize SCSS to CSS (expanded)
            # -----------------------------------------------------------------
            - name: ProcessNormalizeStylesExpanded
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/normalize.scss"
                  outputFile: "./dist/css/normalize.css"
                  styleOption: "expanded"

            # Process reboot SCSS to CSS (compressed)
            # -----------------------------------------------------------------
            - name: ProcessRebootStylesMinified
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/reboot.scss"
                  outputFile: "./dist/css/reboot.min.css"
                  styleOption: "compressed"

            # Process reboot SCSS to CSS (expanded)
            # -----------------------------------------------------------------
            - name: ProcessRebootStylesExpanded
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/reboot.scss"
                  outputFile: "./dist/css/reboot.css"
                  styleOption: "expanded"

            # Copy source SCSS files
            # -----------------------------------------------------------------
            - name: CopySrcSCSS
              action: DirectoryCopyAction
              options:
                  srcDir: "./src/scss"
                  destDir: "./dist/scss"

            # Render the demo page served by `npm run dev` (not published)
            # -----------------------------------------------------------------
            - name: RenderDemoPage
              action: TemplateRenderAction
              options:
                  templatePath: "./exe/pages/index.html.jinja"
                  outputPath: "./dist/html/index.html"
                  searchPaths:
                      - "./exe"
                  contextFiles:
                      - "./exe/data/index.json"

            # Copy license and readme
            # -----------------------------------------------------------------
            - name: CopyLICENSE
              action: FileCopyAction
              options:
                  srcFile: "./LICENSE"
                  destDir: "./dist"

            - name: CopyREADME
              action: FileCopyAction
              options:
                  srcFile: "./README.md"
                  destDir: "./dist"

            # Generate package.json for distribution
            # -----------------------------------------------------------------
            - name: GeneratePackageJSON
              action: PackageManagerAction
              options:
                  packageJsonPath: "./package.json"
                  outputDir: "./dist"
                  fields:
                      - name
                      - version
                      - description
                      - keywords
                      - license
                      - homepage
                      - author
                      - contributors
                      - repository
                      - bugs
                      - funding
                  # Paths are relative to dist/, which is the published root
                  customConfig:
                      main: "css/boot.gl.css"
                      types: null
                      style: "css/boot.gl.css"
                      sass: "scss/index.scss"
                      files:
                          - "css/**/*.css"
                          - "scss/**/*.scss"
                      exports:
                          ".":
                              sass: "./scss/index.scss"
                              style: "./css/boot.gl.css"
                              default: "./css/boot.gl.css"
                          "./scss/*": "./scss/*"
                          "./css/*": "./css/*"
                          "./package.json": "./package.json"

            # Version synchronization
            # -----------------------------------------------------------------
            - name: SyncVersion
              action: VersionWriteAction
              options:
                  files:
                      - path: "./CITATION.cff"
                        key: "version: "
                      - path: "./VERSION"
                        key: "v"
